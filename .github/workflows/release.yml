name: release

# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`
# Attaches the APK + screening artifacts to the GitHub Release.
# NOTE: unsigned debug APK (no keystore in CI yet). Signed release builds are
# a documented follow-up; see the job comment below. After the first green
# Release, delete releases/sih26168-debug.apk from git (migration to Releases).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug --project-dir android
        env:
          APP_VERSION: ${{ github.ref_name }}
      # TODO(signing): add keystore secrets (STORE_FILE/STORE_PASSWORD/KEY_ALIAS/
      # KEY_PASSWORD) and switch to :app:assembleRelease for a signed artifact.
      - run: |
          ls android/app/build/outputs/apk/debug/app-debug.apk
          ls model.tflite scaler.json reports/drift_plot.png
      - run: >
          gh release create "${{ github.ref_name }}"
          android/app/build/outputs/apk/debug/app-debug.apk
          model.tflite scaler.json
          reports/drift_plot.png reports/drift_plot.json
          --title "${{ github.ref_name }}"
          --notes "See CHANGELOG.md. Debug (unsigned) APK for field testing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
