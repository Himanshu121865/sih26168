name: android

on:
  push:
    paths: ["android/**", "model.tflite", "scaler.json"]
  pull_request:
    paths: ["android/**", "model.tflite", "scaler.json"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle :app:assembleDebug :app:testDebugUnitTest --project-dir android
