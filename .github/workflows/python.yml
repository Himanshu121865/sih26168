name: python

on:
  push:
    paths: ["python/**", "tests/**", "pyproject.toml", "sih26168_colab.ipynb"]
  pull_request:
    paths: ["python/**", "tests/**", "pyproject.toml", "sih26168_colab.ipynb"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas pytest pytest-cov
      - run: python -m compileall -q python tests
      - run: PYTHONPATH=. python -m pytest tests/ -q
