[project]
name = "sih26168"
version = "0.1.0"
description = "SIH26168 Intelligent Dead Reckoning — phone-only MEMS IMU dead reckoning"
requires-python = ">=3.11"

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Heavy optional deps (torch) and missing-data paths are Colab-only;
# local `mypy` runs target the stdlib/numpy pure modules.
[[tool.mypy.overrides]]
module = ["python.models.*", "python.datasets.*", "python.inekf_harness", "python.train_avnet", "python.eval_drift", "python.eval_per_file", "python.export_tflite", "python.preprocess"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=python --cov-report=term-missing"
